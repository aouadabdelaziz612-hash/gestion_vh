<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GestionVH — Dept. Informatique FSM</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563eb;--blue2:#3b82f6;--blue3:#dbeafe;--blue4:#eff6ff;
  --purple:#7c3aed;--green:#16a34a;--orange:#ea580c;--red:#dc2626;
  --bg:#f8faff;--white:#ffffff;--sidebar:#1e293b;--border:#e2e8f0;
  --text:#0f172a;--text2:#64748b;--text3:#94a3b8;
  --r:14px;--shadow:0 4px 24px rgba(37,99,235,.1);--shadow2:0 2px 12px rgba(0,0,0,.08);
  --font:"Plus Jakarta Sans",system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes float2{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes float3{0%,100%{transform:translateY(0) rotate(1deg)}50%{transform:translateY(-8px) rotate(-1deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}70%{box-shadow:0 0 0 12px rgba(37,99,235,0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes barGrow{from{height:0}to{height:var(--h)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.fade-up{animation:fadeUp .6s ease both}
.fade-up-1{animation:fadeUp .6s .1s ease both}
.fade-up-2{animation:fadeUp .6s .2s ease both}
.fade-up-3{animation:fadeUp .6s .35s ease both}
.fade-up-4{animation:fadeUp .6s .5s ease both}
.fade-in{animation:fadeIn .5s ease both}

/* ── LANDING LAYOUT ── */
.landing-wrap{display:flex;min-height:100vh}

/* LEFT SIDEBAR */
.l-sidebar{width:170px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.ls-logo{padding:1.25rem 1rem;border-bottom:1px solid #ffffff0f}
.ls-logo-icon{width:36px;height:36px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:.5rem}
.ls-logo-name{font-size:12px;font-weight:700;color:#fff;line-height:1.2}
.ls-logo-sub{font-size:9px;color:#94a3b8;margin-top:2px}
.ls-nav{flex:1;padding:10px 0}
.ln-item{display:flex;align-items:center;gap:8px;padding:9px 14px;color:#94a3b8;font-size:11.5px;cursor:pointer;transition:all .15s;border-radius:0;border-left:2px solid transparent;text-decoration:none}
.ln-item:hover{background:#ffffff0a;color:#fff}
.ln-item.active{background:#2563eb1a;color:var(--blue2);border-left-color:var(--blue2);font-weight:600}
.ln-item .ln-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.ls-year{padding:.75rem 1rem;border-top:1px solid #ffffff0f}
.ls-year-lbl{font-size:9px;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.ls-year-val{background:#1e3a5f;border:1px solid #334155;border-radius:8px;padding:5px 10px;font-size:11px;color:#cbd5e1;cursor:pointer}

/* HERO AREA */
.l-main{flex:1;display:flex;flex-direction:column;min-width:0}
.l-topbar{height:52px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;padding:0 1.5rem;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tb-icon-btn{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:15px}
.tb-icon-btn:hover{background:var(--blue3);border-color:var(--blue2)}
.btn-connect{background:var(--blue);color:#fff;border:none;border-radius:50px;padding:8px 20px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:6px;transition:all .2s;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.btn-connect:hover{background:#1d4ed8;transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.45)}

/* HERO SPLIT */
.hero-split{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 52px)}
.hero-left{background:linear-gradient(145deg,#1e40af,#2563eb,#3b82f6);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:2rem}
.hero-left::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%,rgba(99,102,241,.4),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(6,182,212,.2),transparent 50%)}

/* DASHBOARD MOCKUP */
.mock-wrap{position:relative;z-index:2;width:100%;max-width:420px}
.mock-screen{background:rgba(255,255,255,.96);border-radius:16px;padding:1.1rem;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:float 6s ease-in-out infinite;position:relative}
.mock-hdr{display:flex;align-items:center;gap:6px;margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid #f1f5f9}
.mock-title{font-size:11px;font-weight:700;color:#1e293b}
.mock-stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:.8rem}
.msc{background:var(--bg);border-radius:8px;padding:7px 6px}
.msc-icon{font-size:13px;margin-bottom:2px}
.msc-val{font-size:11px;font-weight:700;color:var(--text)}
.msc-lbl{font-size:8px;color:var(--text2)}
.mock-charts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc-box{background:var(--bg);border-radius:8px;padding:7px}
.mc-lbl{font-size:8px;color:var(--text2);margin-bottom:5px;font-weight:600}
.bar-row{display:flex;align-items:flex-end;gap:3px;height:50px}
.bar-item{flex:1;border-radius:3px 3px 0 0;position:relative;animation:barGrow .8s ease both}
.pie-mock{position:relative;width:48px;height:48px;margin:0 auto}
.pie-svg circle{transition:stroke-dashoffset .8s ease}

/* FLOATING BADGES */
.float-badge{position:absolute;background:white;border-radius:12px;padding:8px 12px;box-shadow:0 8px 32px rgba(0,0,0,.2);display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;color:#1e293b;white-space:nowrap}
.fb-1{top:12%;left:-5%;animation:float2 5s ease-in-out infinite .5s}
.fb-2{bottom:18%;right:-8%;animation:float3 5.5s ease-in-out infinite 1s}
.fb-3{top:55%;left:-10%;animation:float 4.5s ease-in-out infinite 1.5s}
.fb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* HERO RIGHT */
.hero-right{background:var(--white);display:flex;flex-direction:column;justify-content:center;padding:3rem 2.5rem;gap:0}
.hr-tag{display:inline-flex;align-items:center;gap:6px;background:#fef9c3;border:1px solid #fde047;border-radius:20px;padding:4px 14px;font-size:11px;font-weight:600;color:#854d0e;margin-bottom:1.5rem;width:fit-content}
.hr-title{font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:800;line-height:1.15;margin-bottom:1.1rem;color:#0f172a}
.hr-title span{color:var(--blue)}
.hr-sub{font-size:.9rem;color:var(--text2);line-height:1.75;max-width:420px;margin-bottom:2rem}
.hero-feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:1rem}
.hf-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:flex-start;transition:all .2s}
.hf-card:hover{border-color:var(--blue2);transform:translateY(-2px);box-shadow:var(--shadow)}
.hf-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hf-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px}
.hf-desc{font-size:10.5px;color:var(--text2);line-height:1.5}
.l-footer{background:var(--white);border-top:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text2)}

/* ── APP LAYOUT ── */
.app-wrap{display:flex;height:100vh;overflow:hidden}
.app-sidebar{width:185px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.as-logo{padding:1.25rem 1rem;border-bottom:1px solid #ffffff0f}
.as-logo-icon{width:36px;height:36px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:.5rem}
.as-logo-name{font-size:12.5px;font-weight:700;color:#fff}
.as-logo-sub{font-size:9px;color:#94a3b8}
.as-nav{flex:1;padding:8px 0}
.as-item{display:flex;align-items:center;gap:8px;padding:9px 14px;color:#94a3b8;font-size:11.5px;cursor:pointer;transition:all .12s;border-left:2px solid transparent;background:transparent;border-right:none;border-top:none;border-bottom:none;width:100%;font-family:var(--font);text-align:left}
.as-item:hover{background:#ffffff0a;color:#e2e8f0}
.as-item.active{background:#2563eb1a;color:var(--blue2);border-left-color:var(--blue2);font-weight:600}
.as-item .ai{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.as-foot{padding:.75rem;border-top:1px solid #ffffff0f}
.as-year{background:#1e3a5f;border:1px solid #334155;border-radius:8px;padding:6px 10px;font-size:10px;color:#94a3b8;margin-bottom:.5rem}
.as-year-lbl{font-size:9px;color:#475569;margin-bottom:2px}
.app-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.app-topbar{height:52px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;flex-shrink:0}
.at-left{display:flex;align-items:center;gap:10px}
.at-title{font-size:14px;font-weight:700;color:var(--text)}
.at-right{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:1.5rem}

/* ── LOGIN ── */
.login-page{min-height:100vh;display:flex;background:var(--bg)}
.login-left{width:420px;background:linear-gradient(145deg,#1e40af,#2563eb);display:flex;align-items:center;justify-content:center;padding:2rem;flex-shrink:0}
.login-right{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-box{background:var(--white);border-radius:20px;padding:2.25rem;width:380px;box-shadow:0 8px 40px rgba(0,0,0,.1);animation:scaleIn .4s ease}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem}
.ll-icon{width:40px;height:40px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.ll-name{font-size:15px;font-weight:800;color:var(--text)}
.ll-sub{font-size:10px;color:var(--text2)}

/* ── FORMS / UI ── */
.form-label{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:9px 13px;font-size:.875rem;color:var(--text);outline:none;font-family:var(--font);transition:border-color .15s,box-shadow .15s;margin-bottom:1rem}
.form-input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.form-select{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:9px 13px;font-size:.875rem;color:var(--text);outline:none;font-family:var(--font);transition:border-color .15s;margin-bottom:1rem;cursor:pointer}
.form-select:focus{border-color:var(--blue2)}
.error-msg{background:#fef2f2;border:1px solid #fca5a5;color:var(--red);border-radius:9px;padding:8px 13px;font-size:.8rem;margin-bottom:1rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{margin-bottom:.75rem}

/* ── BUTTONS ── */
.btn{border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border:1.5px solid transparent;font-family:var(--font);transition:all .15s;white-space:nowrap}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(37,99,235,.25)}
.btn-outline{background:transparent;color:var(--blue);border-color:var(--blue2)}
.btn-ghost{background:var(--bg);color:var(--text2);border-color:var(--border)}
.btn-red{background:#fef2f2;color:var(--red);border-color:#fca5a5}
.btn-green{background:#f0fdf4;color:var(--green);border-color:#86efac}
.btn-sm{padding:4px 10px;font-size:11px}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;box-shadow:var(--shadow2)}
.card-title{font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem;display:flex;align-items:flex-start;gap:12px;box-shadow:var(--shadow2);transition:all .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.sc-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sc-val{font-size:1.6rem;font-weight:800;line-height:1;color:var(--text)}
.sc-lbl{font-size:10.5px;color:var(--text2);font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.sc-sub{font-size:10px;color:var(--text3);margin-top:3px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.25rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1000px){.grid-4{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.hero-split{grid-template-columns:1fr}.hero-left{display:none}.l-sidebar{display:none}}

/* ── TABLE ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th{padding:9px 14px;text-align:left;font-size:10px;color:var(--text2);font-weight:700;border-bottom:2px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
td{padding:9px 14px;font-size:12.5px;color:var(--text);border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8faff}
.badge{border-radius:6px;padding:3px 9px;font-size:10px;font-weight:700}
.bdg-cm{background:#dbeafe;color:#1d4ed8}
.bdg-td{background:#dcfce7;color:#15803d}
.bdg-tp{background:#fef3c7;color:#b45309}

/* ── PROGRESS ── */
.prog-bg{background:var(--border);border-radius:4px;height:6px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .5s ease}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px);padding:1rem}
.modal-overlay.open{display:flex}
.modal-box{background:var(--white);border-radius:20px;padding:1.75rem;width:500px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 80px rgba(0,0,0,.2);animation:scaleIn .2s ease;border:1px solid var(--border)}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.modal-title{font-size:15px;font-weight:800}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text2)}
.modal-close:hover{background:var(--border)}

/* ── TOAST ── */
#toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:10px 16px;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.12);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px;pointer-events:all}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}

/* ── MISC ── */
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem}
.page-title{font-size:1.15rem;font-weight:800;color:var(--text)}
.empty-state{text-align:center;padding:3rem;color:var(--text2);font-size:.9rem}
.prog-label{display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px}
.range-wrap{display:flex;align-items:center;gap:12px;margin:1rem 0}
.range-wrap input[type=range]{flex:1;accent-color:var(--blue)}
.range-val{font-size:1rem;font-weight:800;color:var(--blue);min-width:50px}
.prev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.25rem}
.prev-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;text-align:center;box-shadow:var(--shadow2)}
.prev-val{font-size:2rem;font-weight:800;color:var(--blue)}
.prev-lbl{font-size:11px;color:var(--text2);margin-top:4px;font-weight:500}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-hdr">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

function renderDash(){
  const d=S.data;
  const totalVH=d.cours.reduce((s,c)=>s+c.heures,0);
  const vhA=d.enseignants.reduce((s,e)=>s+e.vhAssigne,0);
  const moy=d.enseignants.length?Math.round(vhA/d.enseignants.length):0;
  const cmH=d.cours.filter(c=>c.type==="CM").reduce((s,c)=>s+c.heures,0);
  const tdH=d.cours.filter(c=>c.type==="TD").reduce((s,c)=>s+c.heures,0);
  const tpH=d.cours.filter(c=>c.type==="TP").reduce((s,c)=>s+c.heures,0);
  const scards=[
    {l:"Volume horaire total",v:totalVH+"h",icon:"⏱️",c:"#2563eb",bg:"#dbeafe",sub:`${d.cours.length} cours`},
    {l:"Enseignants",v:d.enseignants.length,icon:"👨‍🏫",c:"#16a34a",bg:"#dcfce7",sub:`Moy. ${moy}h`},
    {l:"Filières",v:d.filieres.length,icon:"🎓",c:"#7c3aed",bg:"#f3e8ff",sub:"Actives"},
    {l:"Modules",v:d.cours.length,icon:"📚",c:"#b45309",bg:"#fef3c7",sub:`${cmH}CM · ${tdH}TD · ${tpH}TP`},
  ].map(s=>`<div class="stat-card">
    <div class="sc-ico" style="background:${s.bg}">${s.icon}</div>
    <div><div class="sc-lbl">${s.l}</div><div class="sc-val" style="color:${s.c}">${s.v}</div><div class="sc-sub">${s.sub}</div></div>
  </div>`).join("");

  const rows=d.enseignants.map(e=>{
    const p=e.vhTotal?Math.round(e.vhAssigne/e.vhTotal*100):0;
    const c=p>=90?"#dc2626":p>=70?"#b45309":"#16a34a";
    return`<tr><td><b>${e.nom} ${e.prenom}</b></td><td><span style="font-size:11px;color:var(--text2)">${e.spec}</span></td>
      <td>${e.vhAssigne}h / ${e.vhTotal}h</td>
      <td style="min-width:110px">
        <div class="prog-label"><span></span><span style="color:${c};font-weight:700">${p}%</span></div>
        <div class="prog-bg"><div class="prog-fill" style="width:${p}%;background:${c}"></div></div>
      </td></tr>`;
  }).join("");
  return`
  <div class="grid-4 fade-up">${scards}</div>
  <div class="grid-2" style="margin-bottom:14px">
    <div class="card fade-up-1">
      <div class="card-title">VH par enseignant</div>
      ${svgBarChart(d.enseignants.map(e=>({l:e.nom.substring(0,5),v:e.vhAssigne,max:Math.max(...d.enseignants.map(x=>x.vhTotal))})))}
    </div>
    <div class="card fade-up-2">
      <div class="card-title">Répartition par type de séance</div>
      ${typeChart(cmH,tdH,tpH,totalVH)}
    </div>
  </div>
  <div class="card fade-up-3">
    <div class="card-title">Synthèse enseignants <button class="btn btn-outline btn-sm" onclick="setNav('ens')">Tout voir</button></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Enseignant</th><th>Spécialité</th><th>Volume</th><th>Charge</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function svgBarChart(items){
  const W=300,H=100,pb=20,pw=16;
  const max=Math.max(...items.map(x=>x.v),1);
  const cols=["#2563eb","#7c3aed","#ea580c","#16a34a","#0891b2"];
  const bars=items.map((it,i)=>{
    const x=8+i*(W-16)/items.length;
    const h=Math.round((it.v/max)*(H-pb));
    const y=H-pb-h;
    return`<rect x="${x}" y="${y}" width="${pw}" height="${h}" fill="${cols[i%5]}" rx="3" opacity=".85"/>
      <text x="${x+pw/2}" y="${H-5}" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="Plus Jakarta Sans,sans-serif">${it.l}</text>
      <text x="${x+pw/2}" y="${y-3}" text-anchor="middle" fill="#0f172a" font-size="7" font-weight="700" font-family="Plus Jakarta Sans,sans-serif">${it.v}</text>`;
  }).join("");
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:140px;margin-top:8px">${bars}</svg>`;
}

function typeChart(cm,td,tp,total){
  const items=[{l:"Cours Magistraux (CM)",v:cm,c:"#2563eb"},{l:"Travaux Dirigés (TD)",v:td,c:"#16a34a"},{l:"Travaux Pratiques (TP)",v:tp,c:"#b45309"}];
  return items.map(it=>{
    const p=total?Math.round(it.v/total*100):0;
    return`<div style="margin-bottom:10px">
      <div class="prog-label"><span style="font-size:11.5px;color:var(--text2)">${it.l}</span><span style="color:${it.c};font-weight:700">${it.v}h (${p}%)</span></div>
      <div class="prog-bg"><div class="prog-fill" style="width:${p}%;background:${it.c}"></div></div>
    </div>`;
  }).join("");
}

function addFil(){

function editFil(id){
  const f=S.data.filieres.find(x=>x.id===id);
  openModal(`Modifier — ${f.nom}`,`
    <div class="form-group"><label class="form-label">Nom</label><input class="form-input" id="f-nom" value="${f.nom}"/></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Niveau</label><input class="form-input" id="f-niv" value="${f.niveau}"/></div>

      <button class="btn btn-blue" onclick="saveFil(${id})">Enregistrer</button>
    </div>`);
}
function saveFil(id){
  const nom=document.getElementById("f-nom").value.trim();if(!nom)return;
  const obj={nom,niveau:document.getElementById("f-niv").value,semestre:document.getElementById("f-sem").value,desc:document.getElementById("f-desc").value};
  if(id){Object.assign(S.data.filieres.find(x=>x.id===id),obj);}
  else{obj.id=Math.max(0,...S.data.filieres.map(x=>x.id))+1;S.data.filieres.push(obj);}
  save();closeModal();toast("Filière enregistrée","success");setNav("fil");
}
function delFil(id){
  if(!confirm("Supprimer cette filière ?"))return;
  S.data.filieres=S.data.filieres.filter(x=>x.id!==id);
  S.data.cours=S.data.cours.filter(x=>x.filId!==id);
  save();toast("Filière supprimée");setNav("fil");
}

function addEns(){openModal("Nouvel enseignant",ensForm(null));}
function editEns(id){const e=S.data.enseignants.find(x=>x.id===id);openModal(`Modifier — ${e.nom}`,ensForm(e));}
function saveEns(id){
  const nom=document.getElementById("e-nom").value.trim();if(!nom)return;
  const obj={nom,prenom:document.getElementById("e-pre").value,email:document.getElementById("e-mail").value,spec:document.getElementById("e-spec").value,vhTotal:+document.getElementById("e-vht").value};

    Object.assign(existing,obj);
  } else {
    obj.id=Math.max(0,...S.data.enseignants.map(x=>x.id))+1;

    S.data.enseignants.push(obj);

  recompVH();save();closeModal();toast("Enseignant enregistré","success");setNav("ens");

function delEns(id){

  S.data.enseignants=S.data.enseignants.filter(x=>x.id!==id);
  S.data.cours=S.data.cours.map(function(c){return c.ensId===id?Object.assign({},c,{ensId:null}):c;});

}

function addCours(){openModal("Nouveau cours",coursForm(null));}

}
function delCours(id){

function recompVH(){
  S.data.enseignants.forEach(e=>{

  });
}

function renderPrev(){
  const d=S.data;
  const r=S.prevRate;
  const totalVH=d.cours.reduce((s,c)=>s+c.heures,0);
  const prevVH=Math.round(totalVH*(1+r/100));
  const avgLoad=d.enseignants.length?Math.round(d.enseignants.reduce((s,e)=>s+e.vhTotal,0)/d.enseignants.length):192;
  const nbNeeded=Math.ceil(prevVH/avgLoad);
  const prevMoy=d.enseignants.length?Math.round(prevVH/d.enseignants.length):0;
  const rows=d.filieres.map(f=>{
    const vh=d.cours.filter(c=>c.filId===f.id).reduce((s,c)=>s+c.heures,0);
    const pvh=Math.round(vh*(1+r/100));
    const diff=pvh-vh;
    return`<tr><td><b>${f.nom}</b></td><td>${f.niveau}</td>
      <td>${vh}h</td>
      <td style="color:#2563eb;font-weight:700">${pvh}h</td>
      <td style="color:#16a34a;font-weight:600">+${diff}h</td></tr>`;
  }).join("");
  return`
  <div class="page-hdr fade-up"><div class="page-title">🔮 Prévisions</div></div>
  <div class="card fade-up-1" style="margin-bottom:1.25rem">
    <div class="card-title">Taux de croissance estimé</div>
    <div class="range-wrap">
      <span style="font-size:12px;color:var(--text2)">0%</span>
      <input type="range" min="0" max="50" value="${r}" oninput="updPrev(this.value)"/>
      <span class="range-val" id="prev-lbl">${r}%</span>
      <span style="font-size:12px;color:var(--text2)">50%</span>
    </div>
    <p style="font-size:12px;color:var(--text2)">Ajustez le curseur pour simuler différents scénarios de croissance du volume horaire.</p>
  </div>
  <div class="prev-grid fade-up-2">
    <div class="prev-card"><div class="prev-val">${prevVH}h</div><div class="prev-lbl">Volume horaire prévu</div></div>
    <div class="prev-card"><div class="prev-val">${nbNeeded}</div><div class="prev-lbl">Enseignants nécessaires</div></div>
    <div class="prev-card"><div class="prev-val">${prevMoy}h</div><div class="prev-lbl">Moyenne prévue / ens.</div></div>
  </div>
  <div class="card fade-up-3">
    <div class="card-title">Prévision par filière (taux: +${r}%)</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Filière</th><th>Niveau</th><th>VH Actuel</th><th>VH Prévu</th><th>Différence</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}
function updPrev(v){
  S.prevRate=+v;
  const c=document.querySelector(".content");
  if(c)c.innerHTML=renderPrev();
}

// ═══════════════════════════════════════
//  UTILISATEURS (admin seulement)
// ═══════════════════════════════════════
function renderUsers(){
  const rows=S.users.map(u=>{
    const roleColor=u.role==="admin"?"#dc2626":u.role==="chef"?"#7c3aed":"#2563eb";
    const roleBg=u.role==="admin"?"#fef2f2":u.role==="chef"?"#f3e8ff":"#dbeafe";
    const isMe=S.user.id===u.id;
    return`<tr>
      <td><b>${u.name}</b>${isMe?` <span style="font-size:9px;background:#dcfce7;color:#16a34a;padding:2px 7px;border-radius:10px;font-weight:700">Vous</span>`:""}</td>
      <td style="color:var(--text2);font-size:11.5px">${u.u}</td>
      <td style="color:var(--text2);font-size:11.5px">${u.email}</td>
      <td><span style="background:${roleBg};color:${roleColor};border-radius:6px;padding:3px 9px;font-size:10px;font-weight:700">${u.role}</span></td>
      <td>${u.ensId?`Enseignant #${u.ensId}`:"—"}</td>
      <td><div style="display:flex;gap:4px">
        <button class="btn btn-ghost btn-sm" onclick="editUser(${u.id})">✏️</button>
        ${!isMe?`<button class="btn btn-red btn-sm" onclick="delUser(${u.id})">🗑️</button>`:""}
      </div></td>
    </tr>`;
  }).join("");
  return`
  <div class="page-hdr fade-up">
    <div class="page-title">🔐 Gestion des Utilisateurs</div>
    <button class="btn btn-blue" onclick="addUser()">+ Nouvel utilisateur</button>
  </div>
  <div class="card fade-up-1" style="margin-bottom:1rem;border-color:#dbeafe;background:#eff6ff">
    <div style="font-size:12px;color:#1d4ed8">ℹ️ Seul l'administrateur peut créer, modifier ou supprimer des comptes d'accès. Chaque utilisateur se connecte avec son nom d'utilisateur ou son email.</div>
  </div>
  <div class="card fade-up-2">
    <div class="table-wrap"><table>
      <thead><tr><th>Nom</th><th>Identifiant</th><th>Email</th><th>Rôle</th><th>Lié à</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function userForm(u){
  const ensOptions=`<option value="">— Aucun —</option>`+
    S.data.enseignants.map(e=>`<option value="${e.id}"${u&&u.ensId===e.id?" selected":""}>${e.nom} ${e.prenom}</option>`).join("");
  return`
    <div class="form-row">
      <div class="form-group"><label class="form-label">Nom complet</label><input class="form-input" id="uf-name" value="${u?u.name:""}"/></div>
      <div class="form-group"><label class="form-label">Identifiant (login)</label><input class="form-input" id="uf-u" value="${u?u.u:""}"/></div>
    </div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="uf-email" type="email" value="${u?u.email:""}"/></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Mot de passe${u?" (laisser vide = inchangé)":""}</label><input class="form-input" id="uf-p" type="password" placeholder="••••••••"/></div>
      <div class="form-group"><label class="form-label">Rôle</label>
        <select class="form-select" id="uf-role">
          ${["admin","chef","enseignant"].map(r=>`<option${u&&u.role===r?" selected":""}>${r}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Lier à un enseignant (optionnel)</label>
      <select class="form-select" id="uf-ens">${ensOptions}</select>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-blue" onclick="saveUser(${u?u.id:"null"})">Enregistrer</button>
    </div>`;
}

function addUser(){openModal("Nouvel utilisateur",userForm(null));}
function editUser(id){const u=S.users.find(x=>x.id===id);openModal(`Modifier — ${u.name}`,userForm(u));}

function saveUser(id){
  const name=document.getElementById("uf-name").value.trim();
  const username=document.getElementById("uf-u").value.trim();
  const email=document.getElementById("uf-email").value.trim();
  const pwd=document.getElementById("uf-p").value;
  const role=document.getElementById("uf-role").value;
  const ensId=+document.getElementById("uf-ens").value||null;
  if(!name||!username||!email){toast("Veuillez remplir tous les champs obligatoires","error");return;}
  // vérifier unicité username/email
  const dup=S.users.find(x=>(x.u===username||x.email===email)&&x.id!==+id);
  if(dup){toast("Identifiant ou email déjà utilisé","error");return;}
  if(id&&id!=="null"){
    const u=S.users.find(x=>x.id===+id);
    u.name=name;u.u=username;u.email=email;u.role=role;u.ensId=ensId;
    if(pwd)u.p=pwd;
  } else {
    if(!pwd){toast("Le mot de passe est obligatoire","error");return;}
    S.users.push({id:Math.max(0,...S.users.map(x=>x.id))+1,name,u:username,email,p:pwd,role,ensId});
  }
  saveUsers();closeModal();toast("Utilisateur enregistré","success");setNav("usr");
}

function delUser(id){
  if(!confirm("Supprimer cet utilisateur ?"))return;
  S.users=S.users.filter(x=>x.id!==id);
  saveUsers();toast("Utilisateur supprimé");setNav("usr");
}

// ═══════════════════════════════════════
//  MODAL / TOAST
// ═══════════════════════════════════════
function openModal(title,body){
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-body").innerHTML=body;
  document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open");}
document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});

function toast(msg,type="success"){
  const el=document.createElement("div");
  el.className=`toast ${type}`;
  el.innerHTML=`${type==="success"?"✅":"❌"} ${msg}`;
  document.getElementById("toast").appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

// ═══════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════
function render(){
  if(S.view==="landing")renderLanding();
  else if(S.view==="login")renderLogin();
  else renderApp();
}
render();
</script>
</body>
</html>
