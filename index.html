<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GestionVH — Faculté des Sciences Meknès</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1d4ed8"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GestionVH"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<meta name="description" content="Système de gestion des volumes horaires — FSM Meknès"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563eb;--blue2:#3b82f6;--blue3:#dbeafe;--blue4:#eff6ff;
  --purple:#7c3aed;--green:#16a34a;--orange:#ea580c;--red:#dc2626;
  --cyan:#0891b2;--pink:#db2777;
  --bg:#f0f4ff;--white:#ffffff;--sidebar:#0f172a;--border:#e2e8f0;
  --text:#0f172a;--text2:#64748b;--text3:#94a3b8;
  --r:14px;--shadow:0 8px 32px rgba(37,99,235,.15);--shadow2:0 2px 12px rgba(0,0,0,.08);
  --font:"Plus Jakarta Sans",system-ui,sans-serif;
  --grad1:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 40%,#2563eb 70%,#0ea5e9 100%);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden}

/* ── KEYFRAMES ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(.5deg)}}
@keyframes float2{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-18px) rotate(2deg)}}
@keyframes float3{0%,100%{transform:translateY(0) rotate(1deg)}50%{transform:translateY(-10px) rotate(-1deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin3d{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.88) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes barGrow{from{height:0;opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-300% 0}100%{background-position:300% 0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.4)}70%{box-shadow:0 0 0 16px rgba(37,99,235,0)}}
@keyframes orbit{0%{transform:rotate(0deg) translateX(80px) rotate(0deg)}100%{transform:rotate(360deg) translateX(80px) rotate(-360deg)}}
@keyframes orbit2{0%{transform:rotate(120deg) translateX(60px) rotate(-120deg)}100%{transform:rotate(480deg) translateX(60px) rotate(-480deg)}}
@keyframes orbit3{0%{transform:rotate(240deg) translateX(70px) rotate(-240deg)}100%{transform:rotate(600deg) translateX(70px) rotate(-600deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px rgba(59,130,246,.6))}50%{filter:drop-shadow(0 0 20px rgba(99,102,241,.9))}}
@keyframes count{from{opacity:0;transform:scale(0.5)}to{opacity:1;transform:scale(1)}}
@keyframes wave{0%{transform:scaleY(1)}50%{transform:scaleY(.5)}100%{transform:scaleY(1)}}
@keyframes morphBg{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%}50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%}}
@keyframes tilt{0%,100%{transform:perspective(800px) rotateX(0deg) rotateY(0deg)}25%{transform:perspective(800px) rotateX(2deg) rotateY(-2deg)}75%{transform:perspective(800px) rotateX(-2deg) rotateY(2deg)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
@keyframes typewriter{from{width:0}to{width:100%}}
@keyframes blink{50%{opacity:0}}

.fade-up{animation:fadeUp .7s cubic-bezier(.22,1,.36,1) both}
.fade-up-1{animation:fadeUp .7s .12s cubic-bezier(.22,1,.36,1) both}
.fade-up-2{animation:fadeUp .7s .24s cubic-bezier(.22,1,.36,1) both}
.fade-up-3{animation:fadeUp .7s .38s cubic-bezier(.22,1,.36,1) both}
.fade-up-4{animation:fadeUp .7s .52s cubic-bezier(.22,1,.36,1) both}
.fade-up-5{animation:fadeUp .7s .66s cubic-bezier(.22,1,.36,1) both}
.fade-in{animation:fadeIn .5s ease both}
.slide-right{animation:slideRight .6s cubic-bezier(.22,1,.36,1) both}

/* ── LANDING ── */
.landing-wrap{display:flex;flex-direction:column;min-height:100vh;position:relative;overflow:hidden}

/* Animated mesh background */
.landing-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:morphBg 10s ease-in-out infinite}
.bg-orb-1{width:600px;height:600px;background:radial-gradient(circle,#3b82f6,#6366f1);top:-200px;left:-150px;animation-duration:12s}
.bg-orb-2{width:500px;height:500px;background:radial-gradient(circle,#0ea5e9,#2dd4bf);bottom:-150px;right:-100px;animation-duration:9s;animation-delay:-4s}
.bg-orb-3{width:350px;height:350px;background:radial-gradient(circle,#8b5cf6,#ec4899);top:50%;left:50%;transform:translate(-50%,-50%);animation-duration:15s;animation-delay:-7s}
.grid-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(99,102,241,.18) 1px,transparent 1px);background-size:32px 32px;opacity:.6}

/* TOPBAR */
.l-topbar{height:60px;background:rgba(255,255,255,.75);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;position:sticky;top:0;z-index:50;box-shadow:0 2px 20px rgba(37,99,235,.08)}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-logo-icon{width:38px;height:38px;background:var(--grad1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 14px rgba(37,99,235,.4);animation:glow 3s ease-in-out infinite}
.topbar-logo-name{font-size:14px;font-weight:800;background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar-right{display:flex;align-items:center;gap:10px}
.tb-icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.8);border:1px solid rgba(226,232,240,.8);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tb-icon-btn:hover{background:var(--blue3);border-color:var(--blue2);transform:translateY(-2px)}
.btn-connect{background:var(--grad1);color:#fff;border:none;border-radius:50px;padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:7px;transition:all .25s;box-shadow:0 6px 20px rgba(37,99,235,.4);animation:pulse 3s ease-in-out infinite}
.btn-connect:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 30px rgba(37,99,235,.5)}

/* HERO */
.hero-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 60px);position:relative;z-index:1}

/* LEFT: 3D scene */
.hero-left{position:relative;display:flex;align-items:center;justify-content:center;padding:3rem;overflow:visible}
.scene-3d{position:relative;width:100%;max-width:460px;perspective:1200px}
.card-3d-wrap{animation:tilt 8s ease-in-out infinite;transform-style:preserve-3d}
.mock-screen{background:rgba(255,255,255,.97);border-radius:22px;padding:1.4rem;box-shadow:0 40px 100px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.4),inset 0 1px 0 rgba(255,255,255,.8);animation:float 7s ease-in-out infinite;position:relative;transform-style:preserve-3d;backdrop-filter:blur(20px)}
.mock-screen::before{content:"";position:absolute;inset:-1px;border-radius:23px;background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,.1));z-index:-1}
.mock-hdr{display:flex;align-items:center;gap:6px;margin-bottom:1rem;padding-bottom:.8rem;border-bottom:1px solid #f1f5f9}
.mac-dot{width:10px;height:10px;border-radius:50%}
.mock-title{font-size:12px;font-weight:800;color:#1e293b;margin-left:6px}
.mock-stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:1rem}
.msc{background:linear-gradient(135deg,#f8faff,#eef2ff);border-radius:10px;padding:8px 7px;text-align:center;border:1px solid rgba(99,102,241,.1);transition:transform .2s}
.msc:hover{transform:translateY(-2px)}
.msc-icon{font-size:14px;margin-bottom:3px}
.msc-val{font-size:12px;font-weight:800;color:var(--text)}
.msc-lbl{font-size:8px;color:var(--text2);font-weight:500}
.mock-charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc-box{background:linear-gradient(135deg,#f8faff,#f0f4ff);border-radius:10px;padding:9px;border:1px solid rgba(99,102,241,.08)}
.mc-lbl{font-size:8.5px;color:var(--text2);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.bar-row{display:flex;align-items:flex-end;gap:4px;height:52px}
.bar-item{flex:1;border-radius:4px 4px 0 0;position:relative;animation:barGrow .9s cubic-bezier(.22,1,.36,1) both;transform-origin:bottom}

/* Floating 3D badges */
.float-badge{position:absolute;background:rgba(255,255,255,.95);border-radius:14px;padding:9px 14px;box-shadow:0 12px 40px rgba(0,0,0,.15),0 0 0 1px rgba(255,255,255,.5);display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#1e293b;white-space:nowrap;backdrop-filter:blur(10px)}
.fb-1{top:5%;left:-8%;animation:float2 5.5s ease-in-out infinite .3s}
.fb-2{bottom:12%;right:-10%;animation:float3 6s ease-in-out infinite 1.2s}
.fb-3{top:58%;left:-14%;animation:float 5s ease-in-out infinite .8s}
.fb-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}

/* Orbiting particles */
.orbit-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0}
.orbit-particle{position:absolute;width:10px;height:10px;border-radius:50%;top:-5px;left:-5px}
.orbit-particle:nth-child(1){background:#3b82f6;animation:orbit 8s linear infinite;box-shadow:0 0 10px #3b82f6}
.orbit-particle:nth-child(2){background:#8b5cf6;animation:orbit2 10s linear infinite;box-shadow:0 0 10px #8b5cf6}
.orbit-particle:nth-child(3){background:#06b6d4;animation:orbit3 6s linear infinite;box-shadow:0 0 10px #06b6d4}

/* HERO RIGHT */
.hero-right{display:flex;flex-direction:column;justify-content:center;padding:3.5rem 3rem 3.5rem 2rem;position:relative;z-index:1}
.hr-badge{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,rgba(254,249,195,.9),rgba(253,224,71,.4));border:1.5px solid rgba(253,224,71,.6);border-radius:50px;padding:5px 16px;font-size:11.5px;font-weight:700;color:#78350f;margin-bottom:1.75rem;width:fit-content;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(253,224,71,.25)}
.badge-dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;animation:pulse 2s infinite}
.hr-title{font-size:clamp(1.9rem,3.8vw,2.8rem);font-weight:900;line-height:1.1;margin-bottom:1.25rem;color:#0f172a;letter-spacing:-.02em}
.hr-title .hl{background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline}
.hr-title .hl2{color:var(--purple)}
.hr-sub{font-size:.92rem;color:var(--text2);line-height:1.8;max-width:440px;margin-bottom:2.25rem}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:2.5rem}
.btn-cta{background:var(--grad1);color:#fff;border:none;border-radius:14px;padding:13px 30px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:8px;transition:all .25s;box-shadow:0 8px 28px rgba(37,99,235,.4)}
.btn-cta:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 40px rgba(37,99,235,.5)}
.btn-cta-ghost{background:rgba(255,255,255,.8);color:var(--blue);border:1.5px solid rgba(37,99,235,.2);border-radius:14px;padding:12px 26px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:7px;transition:all .25s;backdrop-filter:blur(8px)}
.btn-cta-ghost:hover{background:var(--blue3);border-color:var(--blue2);transform:translateY(-2px)}

/* FEATURES GRID */
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat-card{background:rgba(255,255,255,.8);border:1px solid rgba(226,232,240,.6);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:flex-start;transition:all .25s;backdrop-filter:blur(8px);cursor:default}
.feat-card:hover{border-color:rgba(99,102,241,.35);transform:translateY(-3px) scale(1.01);box-shadow:0 12px 32px rgba(37,99,235,.12);background:rgba(255,255,255,.95)}
.feat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;transition:transform .2s}
.feat-card:hover .feat-icon{transform:scale(1.15) rotate(-5deg)}
.feat-title{font-size:12.5px;font-weight:800;color:var(--text);margin-bottom:3px}
.feat-desc{font-size:10.5px;color:var(--text2);line-height:1.6}

/* FOOTER */
.l-footer{background:rgba(255,255,255,.7);backdrop-filter:blur(16px);border-top:1px solid rgba(226,232,240,.5);padding:1.1rem 2rem;display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text2);position:relative;z-index:1}

/* ── STATS SECTION (landing) ── */
.stats-strip{background:rgba(255,255,255,.7);backdrop-filter:blur(16px);border-top:1px solid rgba(226,232,240,.4);border-bottom:1px solid rgba(226,232,240,.4);padding:1.5rem 2rem;display:flex;justify-content:center;gap:4rem;position:relative;z-index:1}
.stat-pill{text-align:center}
.stat-pill-val{font-size:1.8rem;font-weight:900;background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.stat-pill-lbl{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}

/* ── LOGIN ── */
.login-page{min-height:100vh;display:flex;position:relative;overflow:hidden}
.login-left{width:440px;background:var(--grad1);display:flex;align-items:center;justify-content:center;padding:2.5rem;flex-shrink:0;position:relative;overflow:hidden}
.login-left::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 70%,rgba(99,102,241,.5),transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(6,182,212,.3),transparent 50%)}
.login-left-content{position:relative;z-index:1;text-align:center;color:white}
.login-illustration{width:140px;height:140px;margin:0 auto 1.5rem;position:relative}
.login-orb{position:absolute;border-radius:50%;animation:float 6s ease-in-out infinite}
.login-right{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg)}
.login-box{background:var(--white);border-radius:24px;padding:2.5rem;width:430px;max-width:100%;box-shadow:0 20px 80px rgba(0,0,0,.12);animation:scaleIn .4s cubic-bezier(.22,1,.36,1);border:1px solid rgba(226,232,240,.6)}
.login-logo{display:flex;align-items:center;gap:11px;margin-bottom:1.75rem}
.ll-icon{width:44px;height:44px;background:var(--grad1);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px rgba(37,99,235,.4)}
.ll-name{font-size:16px;font-weight:900;color:var(--text)}

/* ── TABS ── */
.auth-tabs{display:flex;gap:4px;background:#f1f5f9;border-radius:14px;padding:4px;margin-bottom:1.75rem}
.auth-tab{flex:1;padding:9px;border-radius:11px;border:none;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s;background:transparent;color:var(--text2)}
.auth-tab.active{background:var(--white);color:var(--blue);box-shadow:0 2px 10px rgba(0,0,0,.1);font-weight:700}

/* ── FORMS ── */
.form-label{font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.form-input{width:100%;background:#f8faff;border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:.88rem;color:var(--text);outline:none;font-family:var(--font);transition:all .18s;margin-bottom:1rem}
.form-input:focus{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(59,130,246,.1);background:var(--white)}
.form-select{width:100%;background:#f8faff;border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:.88rem;color:var(--text);outline:none;font-family:var(--font);transition:all .18s;margin-bottom:1rem;cursor:pointer}
.form-select:focus{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(59,130,246,.1)}
.error-msg{background:#fef2f2;border:1px solid #fca5a5;color:var(--red);border-radius:10px;padding:9px 14px;font-size:.8rem;margin-bottom:1rem;display:flex;align-items:center;gap:7px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{margin-bottom:.75rem}

/* ── BUTTONS ── */
.btn{border-radius:10px;padding:7px 15px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border:1.5px solid transparent;font-family:var(--font);transition:all .18s;white-space:nowrap}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-blue{background:var(--grad1);color:#fff;border:none;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.btn-blue:hover{opacity:1;box-shadow:0 8px 24px rgba(37,99,235,.45)}
.btn-outline{background:transparent;color:var(--blue);border-color:var(--blue2)}
.btn-ghost{background:#f8faff;color:var(--text2);border-color:#e2e8f0}
.btn-red{background:#fef2f2;color:var(--red);border-color:#fca5a5}
.btn-green{background:#f0fdf4;color:var(--green);border-color:#86efac}
.btn-sm{padding:5px 11px;font-size:11.5px;border-radius:8px}
.btn-full{width:100%;justify-content:center;padding:12px;font-size:14px;border-radius:12px}

/* ── APP LAYOUT ── */
.app-wrap{display:flex;height:100vh;overflow:hidden}
.app-sidebar{width:200px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:width .25s}
.as-logo{padding:1.35rem 1rem;border-bottom:1px solid #ffffff10}
.as-logo-icon{width:38px;height:38px;background:var(--grad1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:.5rem;animation:glow 3s ease-in-out infinite}
.as-logo-name{font-size:13px;font-weight:800;color:#fff;letter-spacing:-.01em}
.as-logo-sub{font-size:9px;color:#64748b;margin-top:2px}
.as-nav{flex:1;padding:8px 0}
.as-item{display:flex;align-items:center;gap:9px;padding:10px 15px;color:#94a3b8;font-size:12px;cursor:pointer;transition:all .15s;border-left:2px solid transparent;background:transparent;border-right:none;border-top:none;border-bottom:none;width:100%;font-family:var(--font);text-align:left;position:relative;overflow:hidden}
.as-item::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(37,99,235,.15),transparent);opacity:0;transition:opacity .2s}
.as-item:hover{color:#e2e8f0}
.as-item:hover::before{opacity:1}
.as-item.active{color:var(--blue2);border-left-color:var(--blue2);font-weight:700}
.as-item.active::before{opacity:1}
.as-item .ai{font-size:15px;width:20px;text-align:center;flex-shrink:0;transition:transform .2s}
.as-item:hover .ai{transform:scale(1.2)}
.as-foot{padding:.85rem;border-top:1px solid #ffffff10}
.as-year{background:rgba(30,58,95,.6);border:1px solid #334155;border-radius:10px;padding:7px 11px;font-size:10px;color:#94a3b8;margin-bottom:.6rem}
.as-year-lbl{font-size:9px;color:#475569;margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em}
.app-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.app-topbar{height:54px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;flex-shrink:0;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.at-left{display:flex;align-items:center;gap:10px}
.at-title{font-size:14px;font-weight:800;color:var(--text)}
.at-right{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:1.5rem}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.35rem;box-shadow:0 2px 16px rgba(0,0,0,.06);transition:box-shadow .2s}
.card:hover{box-shadow:0 6px 24px rgba(37,99,235,.1)}
.card-title{font-size:.92rem;font-weight:800;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem;display:flex;align-items:flex-start;gap:13px;box-shadow:0 2px 16px rgba(0,0,0,.06);transition:all .25s;position:relative;overflow:hidden}
.stat-card::after{content:"";position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;background:var(--sc-color,#3b82f6);opacity:.07;transition:all .3s}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.stat-card:hover::after{width:120px;height:120px;opacity:.1}
.sc-ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.sc-val{font-size:1.7rem;font-weight:900;line-height:1;color:var(--text);letter-spacing:-.02em}
.sc-lbl{font-size:10.5px;color:var(--text2);font-weight:700;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.sc-sub{font-size:10px;color:var(--text3);margin-top:4px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:1.35rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
@media(max-width:1100px){.grid-4{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.hero-wrap{grid-template-columns:1fr}.hero-left{display:none}}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:separate;border-spacing:0}
th{padding:10px 15px;text-align:left;font-size:10px;color:var(--text2);font-weight:800;border-bottom:2px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.07em;background:#fafbff}
td{padding:10px 15px;font-size:12.5px;color:var(--text);border-bottom:1px solid var(--border);transition:background .15s}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f5f8ff}
.badge{border-radius:7px;padding:3px 10px;font-size:10px;font-weight:800;letter-spacing:.03em}
.bdg-cm{background:#dbeafe;color:#1d4ed8}
.bdg-td{background:#dcfce7;color:#15803d}
.bdg-tp{background:#fef3c7;color:#b45309}

/* ── PROGRESS ── */
.prog-bg{background:#e2e8f0;border-radius:5px;height:7px;overflow:hidden}
.prog-fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.22,1,.36,1)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(6px);padding:1rem}
.modal-overlay.open{display:flex}
.modal-box{background:var(--white);border-radius:22px;padding:1.85rem;width:520px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 90px rgba(0,0,0,.22);animation:scaleIn .25s cubic-bezier(.22,1,.36,1);border:1px solid var(--border)}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.35rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:900}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text2);transition:all .15s}
.modal-close:hover{background:#fef2f2;color:var(--red);border-color:#fca5a5}

/* ── TOAST ── */
#toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:11px 18px;font-size:12.5px;box-shadow:0 10px 40px rgba(0,0,0,.14);animation:slideRight .3s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;gap:9px;pointer-events:all;font-weight:600}
.toast.success{border-left:4px solid var(--green)}
.toast.error{border-left:4px solid var(--red)}

/* ── MISC ── */
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.35rem;flex-wrap:wrap;gap:.75rem}
.page-title{font-size:1.2rem;font-weight:900;color:var(--text);letter-spacing:-.01em}
.empty-state{text-align:center;padding:3rem;color:var(--text2);font-size:.9rem}
.prog-label{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:4px;font-weight:600}
.range-wrap{display:flex;align-items:center;gap:13px;margin:1rem 0}
.range-wrap input[type=range]{flex:1;accent-color:var(--blue);cursor:pointer}
.range-val{font-size:1.1rem;font-weight:900;color:var(--blue);min-width:52px}
.prev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.35rem}
.prev-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;text-align:center;box-shadow:var(--shadow2);transition:all .25s;position:relative;overflow:hidden}
.prev-card::before{content:"";position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:80px;height:80px;border-radius:50%;background:var(--blue3);opacity:.6}
.prev-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.prev-val{font-size:2.2rem;font-weight:900;background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:relative;z-index:1}
.prev-lbl{font-size:11px;color:var(--text2);margin-top:5px;font-weight:600;position:relative;z-index:1}

/* ── SPARKLES ── */
.sparkle{position:absolute;pointer-events:none}
.sparkle::before,.sparkle::after{content:"✦";position:absolute;font-size:12px;color:rgba(253,224,71,.7);animation:sparkle 3s ease-in-out infinite}
.sparkle:nth-child(2)::before{animation-delay:1s;font-size:8px;left:30px;top:-10px}
.sparkle:nth-child(3)::after{animation-delay:2s;font-size:10px;left:60px;top:20px}

/* ── WAVE LOADER ── */
.wave-bars{display:flex;align-items:flex-end;gap:3px;height:20px}
.wave-bar{width:4px;background:var(--blue2);border-radius:2px;animation:wave 1.2s ease-in-out infinite}
.wave-bar:nth-child(2){animation-delay:.2s}
.wave-bar:nth-child(3){animation-delay:.4s}
.wave-bar:nth-child(4){animation-delay:.6s}
.wave-bar:nth-child(5){animation-delay:.8s}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.4);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:rgba(99,102,241,.5)}
</style>
</head>

function togglePwd(id,btn){
  const el=document.getElementById(id);
  el.type=el.type==="password"?"text":"password";
  btn.textContent=el.type==="password"?"👁":"🙈";
}
function doLogin(){
  const u=document.getElementById("lu").value.trim();
  const p=document.getElementById("lp").value;
  ALL_USERS=loadUsers();
  const f=ALL_USERS.find(x=>x.u===u&&x.p===p);
  if(!f){document.getElementById("lerr").style.display="flex";return;}
  S.user=f;S.view="app";S.nav="dash";render();
}
function doRegister(){
  const prenom=document.getElementById("rprenom").value.trim();
  const nom=document.getElementById("rnom").value.trim();
  const email=document.getElementById("remail").value.trim();
  const dob=document.getElementById("rdob").value;
  const u=document.getElementById("ru").value.trim();
  const p=document.getElementById("rp").value;
  const qIdx=document.getElementById("rq").value;
  const qa=document.getElementById("rqa").value.trim().toLowerCase();
  const err=document.getElementById("rerr");
  if(!prenom||!nom||!email||!dob||!u||!p||!qa){err.innerHTML="❌ Veuillez remplir tous les champs.";err.style.display="flex";return;}
  if(p.length<6){err.innerHTML="❌ Mot de passe trop court (min. 6 caractères).";err.style.display="flex";return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.innerHTML="❌ Email invalide.";err.style.display="flex";return;}
  ALL_USERS=loadUsers();
  if(ALL_USERS.find(x=>x.u===u)){err.innerHTML="❌ Ce nom d'utilisateur est déjà pris.";err.style.display="flex";return;}
  ALL_USERS.push({u,p,role:"enseignant",name:`${prenom} ${nom}`,email,dob,qIdx:+qIdx,qa});
  saveUsers(ALL_USERS);
  toast("Compte créé avec succès ! 🎉");
  renderLogin("login");
}
let _forgotUser=null;
function forgotStep1(){
  const u=document.getElementById("fu").value.trim();
  ALL_USERS=loadUsers();
  const found=ALL_USERS.find(x=>x.u===u);
  const err=document.getElementById("ferr");
  if(!found){err.innerHTML="❌ Nom d'utilisateur introuvable.";err.style.display="flex";return;}
  _forgotUser=found;
  err.style.display="none";
  document.getElementById("fstep1").style.display="none";
  document.getElementById("fqbox").textContent="❓ "+SECRET_QUESTIONS[found.qIdx??0];
  document.getElementById("fstep2").style.display="block";
}
function forgotStep2(){
  const ans=document.getElementById("fanswer").value.trim().toLowerCase();
  const newp=document.getElementById("fnewp").value;
  const err=document.getElementById("ferr");
  const ok=document.getElementById("fok");
  if(!_forgotUser)return;
  if(ans!==(_forgotUser.qa||"")){err.innerHTML="❌ Réponse incorrecte.";err.style.display="flex";return;}
  if(newp.length<6){err.innerHTML="❌ Mot de passe trop court.";err.style.display="flex";return;}
  ALL_USERS=loadUsers();
  const idx=ALL_USERS.findIndex(x=>x.u===_forgotUser.u);
  if(idx>=0){ALL_USERS[idx].p=newp;saveUsers(ALL_USERS);}
  _forgotUser=null;
  err.style.display="none";
  ok.textContent="✅ Mot de passe réinitialisé avec succès !";
  ok.style.display="block";
  setTimeout(()=>renderLogin("login"),2000);
}

function renderDash(){
  const d=S.data;
  const totalVH=d.cours.reduce((s,c)=>s+c.heures,0);
  const vhA=d.enseignants.reduce((s,e)=>s+e.vhAssigne,0);
  const moy=d.enseignants.length?Math.round(vhA/d.enseignants.length):0;
  const cmH=d.cours.filter(c=>c.type==="CM").reduce((s,c)=>s+c.heures,0);
  const tdH=d.cours.filter(c=>c.type==="TD").reduce((s,c)=>s+c.heures,0);
  const tpH=d.cours.filter(c=>c.type==="TP").reduce((s,c)=>s+c.heures,0);
  const scards=[
    {l:"Volume horaire total",v:totalVH+"h",icon:"⏱️",c:"#2563eb",bg:"#dbeafe",sub:`${d.cours.length} cours · CM/TD/TP`},
    {l:"Enseignants",v:d.enseignants.length,icon:"👨‍🏫",c:"#16a34a",bg:"#dcfce7",sub:`Moy. ${moy}h / ens.`},
    {l:"Filières",v:d.filieres.length,icon:"🎓",c:"#7c3aed",bg:"#f3e8ff",sub:"Actives 2025–26"},
    {l:"Modules",v:d.cours.length,icon:"📚",c:"#b45309",bg:"#fef3c7",sub:`${cmH}h CM · ${tdH}h TD · ${tpH}h TP`},
  ].map(s=>`<div class="stat-card" style="--sc-color:${s.c}">
    <div class="sc-ico" style="background:${s.bg}">${s.icon}</div>
    <div><div class="sc-lbl">${s.l}</div><div class="sc-val" style="color:${s.c}">${s.v}</div><div class="sc-sub">${s.sub}</div></div>
  </div>`).join("");
  const rows=d.enseignants.map(e=>{
    const p=e.vhTotal?Math.round(e.vhAssigne/e.vhTotal*100):0;
    const c=p>=90?"#dc2626":p>=70?"#b45309":"#16a34a";
    return`<tr><td><b>${e.nom} ${e.prenom}</b></td><td><span style="font-size:11px;color:var(--text2)">${e.spec}</span></td>
      <td>${e.vhAssigne}h / ${e.vhTotal}h</td>
      <td style="min-width:120px">
        <div class="prog-label"><span></span><span style="color:${c};font-weight:800">${p}%</span></div>
        <div class="prog-bg"><div class="prog-fill" style="width:${p}%;background:${c}"></div></div>
      </td></tr>`;
  }).join("");
  return`
  <div class="grid-4 fade-up">${scards}</div>
  <div class="grid-2" style="margin-bottom:14px">
    <div class="card fade-up-1">
      <div class="card-title">📊 VH par enseignant</div>
      ${svgBarChart(d.enseignants.map(e=>({l:e.nom.substring(0,5),v:e.vhAssigne,max:Math.max(...d.enseignants.map(x=>x.vhTotal))})))}
    </div>
    <div class="card fade-up-2">
      <div class="card-title">🥧 Répartition par type de séance</div>
      ${typeChart(cmH,tdH,tpH,totalVH)}
    </div>
  </div>
  <div class="card fade-up-3">
    <div class="card-title">👥 Synthèse enseignants <button class="btn btn-outline btn-sm" onclick="setNav('ens')">Tout voir</button></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Enseignant</th><th>Spécialité</th><th>Volume</th><th>Charge</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function svgBarChart(items){
  const W=320,H=110,pb=22,pw=18;
  const max=Math.max(...items.map(x=>x.v),1);
  const cols=["#3b82f6","#7c3aed","#ea580c","#16a34a","#0891b2","#db2777"];
  const bars=items.map((it,i)=>{
    const x=10+i*(W-20)/items.length;
    const h=Math.round((it.v/max)*(H-pb));
    const y=H-pb-h;
    return`<rect x="${x}" y="${y}" width="${pw}" height="${h}" fill="${cols[i%6]}" rx="4" opacity=".88"/>
      <text x="${x+pw/2}" y="${H-5}" text-anchor="middle" fill="#94a3b8" font-size="7.5" font-family="Plus Jakarta Sans,sans-serif">${it.l}</text>
      <text x="${x+pw/2}" y="${y-4}" text-anchor="middle" fill="#0f172a" font-size="7.5" font-weight="800" font-family="Plus Jakarta Sans,sans-serif">${it.v}</text>`;
  }).join("");
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:150px;margin-top:8px">${bars}</svg>`;
}

function typeChart(cm,td,tp,total){
  const items=[{l:"Cours Magistraux (CM)",v:cm,c:"#2563eb"},{l:"Travaux Dirigés (TD)",v:td,c:"#16a34a"},{l:"Travaux Pratiques (TP)",v:tp,c:"#b45309"}];
  return items.map(it=>{
    const p=total?Math.round(it.v/total*100):0;
    return`<div style="margin-bottom:12px">
      <div class="prog-label"><span style="font-size:12px;color:var(--text2)">${it.l}</span><span style="color:${it.c};font-weight:800">${it.v}h (${p}%)</span></div>
      <div class="prog-bg" style="height:9px"><div class="prog-fill" style="width:${p}%;background:linear-gradient(90deg,${it.c},${it.c}88)"></div></div>
    </div>`;
  }).join("");
}

function editFil(id){
  const f=S.data.filieres.find(x=>x.id===id);
  openModal(`Modifier — ${f.nom}`,`
    <div class="form-group"><label class="form-label">Nom</label><input class="form-input" id="f-nom" value="${f.nom}"/></div>

      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-blue" onclick="saveFil(${id})">Enregistrer</button>

function saveFil(id){
  const nom=document.getElementById("f-nom").value.trim();if(!nom)return;
  const obj={nom,niveau:document.getElementById("f-niv").value,semestre:document.getElementById("f-sem").value,desc:document.getElementById("f-desc").value};
  if(id){Object.assign(S.data.filieres.find(x=>x.id===id),obj);}
  else{obj.id=Math.max(0,...S.data.filieres.map(x=>x.id))+1;S.data.filieres.push(obj);}
  save();closeModal();toast("Filière enregistrée ✅");setNav("fil");
}
function delFil(id){
  if(!confirm("Supprimer cette filière et ses cours ?"))return;
  S.data.filieres=S.data.filieres.filter(x=>x.id!==id);
  S.data.cours=S.data.cours.filter(x=>x.filId!==id);
  save();toast("Filière supprimée");setNav("fil");
}

function addEns(){openModal("Nouvel enseignant",ensForm(null));}
function editEns(id){const e=S.data.enseignants.find(x=>x.id===id);openModal(`Modifier — ${e.nom}`,ensForm(e));}
function saveEns(id){
  const nom=document.getElementById("e-nom").value.trim();if(!nom)return;

  if(id&&id!=="null"){Object.assign(S.data.enseignants.find(x=>x.id===+id),obj);}

}
function delEns(id){

}

function coursForm(c){

function addCours(){openModal("Nouveau cours",coursForm(null));}
function editCours(id){const c=S.data.cours.find(x=>x.id===id);openModal(`Modifier — ${c.intitule}`,coursForm(c));}
function saveCours(id){
  const int=document.getElementById("c-int").value.trim();if(!int)return;
  const obj={intitule:int,filId:+document.getElementById("c-fil").value,type:document.getElementById("c-type").value,heures:+document.getElementById("c-h").value,ensId:+document.getElementById("c-ens").value||null,salId:+document.getElementById("c-sal").value||null};
  if(id&&id!=="null"){Object.assign(S.data.cours.find(x=>x.id===+id),obj);}

}
function delCours(id){
  if(!confirm("Supprimer ce cours ?"))return;
  S.data.cours=S.data.cours.filter(x=>x.id!==id);
  recompVH();save();toast("Cours supprimé");setNav("crs");
}
function recompVH(){
  S.data.enseignants.forEach(e=>{
    e.vhAssigne=S.data.cours.filter(c=>c.ensId===e.id).reduce((s,c)=>s+c.heures,0);
  });
}

function renderRep(){
  const d=S.data;
  const totalVH=d.cours.reduce((s,c)=>s+c.heures,0);
  const assigned=d.cours.filter(c=>c.ensId).reduce((s,c)=>s+c.heures,0);
  const unassigned=d.cours.filter(c=>!c.ensId);
  const cards=d.enseignants.map(e=>{
    const ec=d.cours.filter(c=>c.ensId===e.id);
    const p=e.vhTotal?Math.round(e.vhAssigne/e.vhTotal*100):0;
    const c=p>=90?"#dc2626":p>=70?"#b45309":"#16a34a";
    const libre=e.vhTotal-e.vhAssigne;
    const courseList=ec.map(c=>{
      const f=d.filieres.find(x=>x.id===c.filId);
      const bc=c.type==="CM"?"bdg-cm":c.type==="TD"?"bdg-td":"bdg-tp";
      return`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px">
        <span>${c.intitule} <span class="badge ${bc}" style="font-size:9px">${c.type}</span></span>
        <span style="color:var(--text2)">${f?f.nom.substring(0,10):"—"} · ${c.heures}h</span>
      </div>`;
    }).join("")||`<p style="font-size:12px;color:var(--text3);padding:.5rem 0">Aucun cours affecté</p>`;
    return`<div class="card" style="animation:fadeUp .5s ease both">
      <div style="display:flex;justify-content:space-between;margin-bottom:.9rem">
        <div><b style="font-size:.95rem">${e.nom} ${e.prenom}</b><br><span style="font-size:11px;color:var(--text2)">${e.spec}</span></div>
        <div style="text-align:right"><b style="color:${c};font-size:1.2rem">${e.vhAssigne}h</b><br><span style="font-size:10px;color:var(--text2)">Libre: ${libre}h</span></div>
      </div>
      <div class="prog-label"><span style="font-size:11px;color:${c};font-weight:700">Charge globale</span><span style="font-weight:900;color:${c}">${p}%</span></div>
      <div class="prog-bg" style="height:9px;margin-bottom:.9rem"><div class="prog-fill" style="width:${p}%;background:linear-gradient(90deg,${c},${c}88)"></div></div>
      ${courseList}
    </div>`;
  }).join("");
  return`
  <div class="page-hdr fade-up"><div class="page-title">📋 Répartition des charges</div></div>
  <div class="grid-3 fade-up" style="margin-bottom:1.35rem">
    <div class="stat-card"><div class="sc-ico" style="background:#dbeafe">⏱️</div><div><div class="sc-lbl">Total cours</div><div class="sc-val" style="color:#2563eb">${totalVH}h</div></div></div>
    <div class="stat-card"><div class="sc-ico" style="background:#dcfce7">✅</div><div><div class="sc-lbl">Affecté</div><div class="sc-val" style="color:#16a34a">${assigned}h</div></div></div>
    <div class="stat-card"><div class="sc-ico" style="background:#fef3c7">⚠️</div><div><div class="sc-lbl">Non affecté</div><div class="sc-val" style="color:#b45309">${totalVH-assigned}h</div></div></div>
  </div>
  ${unassigned.length?`<div class="card" style="border-color:#fde68a;margin-bottom:1.35rem;background:#fffbeb">
    <div class="card-title" style="color:#b45309">⚠️ Cours non affectés (${unassigned.length})</div>
    ${unassigned.map(c=>`<div style="font-size:12.5px;color:var(--text2);padding:4px 0">• ${c.intitule} — ${c.heures}h</div>`).join("")}
  </div>`:""}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">${cards}</div>`;
}

function renderStat(){
  const d=S.data;
  const totalVH=d.cours.reduce((s,c)=>s+c.heures,0);
  const vhA=d.enseignants.reduce((s,e)=>s+e.vhAssigne,0);
  const moy=d.enseignants.length?Math.round(vhA/d.enseignants.length):0;
  const cmH=d.cours.filter(c=>c.type==="CM").reduce((s,c)=>s+c.heures,0);
  const tdH=d.cours.filter(c=>c.type==="TD").reduce((s,c)=>s+c.heures,0);
  const tpH=d.cours.filter(c=>c.type==="TP").reduce((s,c)=>s+c.heures,0);
  const vhByFil=d.filieres.map(f=>({l:f.nom.substring(0,8),v:d.cours.filter(c=>c.filId===f.id).reduce((s,c)=>s+c.heures,0)}));
  const synthRows=d.enseignants.map(e=>{
    const ec=d.cours.filter(c=>c.ensId===e.id);
    const p=e.vhTotal?Math.round(e.vhAssigne/e.vhTotal*100):0;
    const c=p>=90?"#dc2626":p>=70?"#b45309":"#16a34a";
    return`<tr><td><b>${e.nom} ${e.prenom}</b></td><td>${e.spec}</td>
      <td>${ec.filter(c=>c.type==="CM").reduce((s,c)=>s+c.heures,0)}h</td>
      <td>${ec.filter(c=>c.type==="TD").reduce((s,c)=>s+c.heures,0)}h</td>
      <td>${ec.filter(c=>c.type==="TP").reduce((s,c)=>s+c.heures,0)}h</td>
      <td style="color:${c};font-weight:800">${e.vhAssigne}h</td>
      <td style="min-width:110px">
        <div class="prog-bg" style="height:8px"><div class="prog-fill" style="width:${p}%;background:${c}"></div></div>
        <span style="font-size:10.5px;color:${c};font-weight:800">${p}%</span>
      </td></tr>`;
  }).join("");
  return`
  <div class="page-hdr fade-up"><div class="page-title">📈 Statistiques globales</div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:1.35rem" class="fade-up">
    ${[{l:"VH Total",v:totalVH+"h",c:"#2563eb",bg:"#dbeafe",icon:"⏱️"},{l:"VH Assigné",v:vhA+"h",c:"#16a34a",bg:"#dcfce7",icon:"✅"},{l:"Moyenne / ens.",v:moy+"h",c:"#7c3aed",bg:"#f3e8ff",icon:"📊"},{l:"CM (h)",v:cmH+"h",c:"#2563eb",bg:"#dbeafe",icon:"🎤"},{l:"TD (h)",v:tdH+"h",c:"#16a34a",bg:"#dcfce7",icon:"✍️"},{l:"TP (h)",v:tpH+"h",c:"#b45309",bg:"#fef3c7",icon:"🔬"}].map(s=>`<div class="stat-card" style="--sc-color:${s.c}"><div class="sc-ico" style="background:${s.bg}">${s.icon}</div><div><div class="sc-lbl">${s.l}</div><div class="sc-val" style="color:${s.c}">${s.v}</div></div></div>`).join("")}
  </div>
  <div class="grid-2 fade-up-1" style="margin-bottom:1.35rem">
    <div class="card">
      <div class="card-title">📊 VH par enseignant</div>
      ${svgBarChart(d.enseignants.map(e=>({l:e.nom.substring(0,5),v:e.vhAssigne,max:Math.max(...d.enseignants.map(x=>x.vhTotal))})))}
    </div>
    <div class="card">
      <div class="card-title">📚 VH par filière</div>
      ${svgBarChart(vhByFil)}
    </div>
  </div>
  <div class="card fade-up-2">
    <div class="card-title">📋 Synthèse détaillée par enseignant</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Enseignant</th><th>Spécialité</th><th>CM</th><th>TD</th><th>TP</th><th>Total</th><th>Charge</th></tr></thead>
      <tbody>${synthRows}</tbody>
    </table></div>
  </div>`;
}

function renderPrev(){
  const d=S.data;
  const r=S.prevRate;
  const totalVH=d.cours.reduce((s,c)=>s+c.heures,0);
  const prevVH=Math.round(totalVH*(1+r/100));
  const avgLoad=d.enseignants.length?Math.round(d.enseignants.reduce((s,e)=>s+e.vhTotal,0)/d.enseignants.length):192;
  const nbNeeded=Math.ceil(prevVH/avgLoad);
  const prevMoy=d.enseignants.length?Math.round(prevVH/d.enseignants.length):0;
  const rows=d.filieres.map(f=>{
    const vh=d.cours.filter(c=>c.filId===f.id).reduce((s,c)=>s+c.heures,0);
    const pvh=Math.round(vh*(1+r/100));
    return`<tr><td><b>${f.nom}</b></td><td>${f.niveau}</td>
      <td>${vh}h</td>
      <td style="color:#2563eb;font-weight:800">${pvh}h</td>
      <td style="color:#16a34a;font-weight:700">+${pvh-vh}h (${r}%)</td></tr>`;
  }).join("");
  return`
  <div class="page-hdr fade-up"><div class="page-title">🔮 Prévisions année suivante</div></div>
  <div class="card fade-up-1" style="margin-bottom:1.35rem">
    <div class="card-title">📐 Taux de croissance estimé</div>
    <div class="range-wrap">
      <span style="font-size:12px;color:var(--text2);font-weight:600">0%</span>
      <input type="range" min="0" max="50" value="${r}" oninput="updPrev(this.value)" style="height:6px"/>
      <span class="range-val" id="prev-lbl">${r}%</span>
      <span style="font-size:12px;color:var(--text2);font-weight:600">50%</span>
    </div>
    <p style="font-size:12.5px;color:var(--text2)">Simulez différents scénarios de croissance du volume horaire pour préparer l'année prochaine.</p>
  </div>
  <div class="prev-grid fade-up-2">
    <div class="prev-card"><div class="prev-val">${prevVH}h</div><div class="prev-lbl">Volume horaire prévu</div></div>
    <div class="prev-card"><div class="prev-val">${nbNeeded}</div><div class="prev-lbl">Enseignants nécessaires</div></div>
    <div class="prev-card"><div class="prev-val">${prevMoy}h</div><div class="prev-lbl">Charge moyenne prévue</div></div>
  </div>
  <div class="card fade-up-3">
    <div class="card-title">📋 Prévisions par filière (taux: +${r}%)</div>

  const typeColor={CM:"#1d4ed8",TD:"#15803d",TP:"#b45309"};

    const used=d.cours.filter(c=>c.salId===s.id).length;
    const bg=typeBg[s.type]||"#f3f4f6";
    const tc=typeColor[s.type]||"#374151";
    return`<tr>
      <td><b>${s.nom}</b></td>
      <td><span class="badge" style="background:${bg};color:${tc}">${s.type}</span></td>
      <td>${s.capacite} places</td>
      <td>${s.batiment||"—"}</td>
      <td><b>${used}</b> cours affectés</td>

      </div></td>
    </tr>`;
  }).join("");
  const stats={CM:d.salles.filter(s=>s.type==="CM"),TD:d.salles.filter(s=>s.type==="TD"),TP:d.salles.filter(s=>s.type==="TP")};
  return`

  </div>
  <div class="grid-3 fade-up" style="margin-bottom:1.35rem">
    ${["CM","TD","TP"].map(t=>`<div class="stat-card" style="--sc-color:${typeColor[t]}">
      <div class="sc-ico" style="background:${typeBg[t]}">${t==="CM"?"🎤":t==="TD"?"✍️":"🔬"}</div>
      <div>
        <div class="sc-lbl">${t==="CM"?"Amphithéâtres":t==="TD"?"Salles TD":"Labos TP"}</div>
        <div class="sc-val" style="color:${typeColor[t]}">${stats[t].length}</div>
        <div class="sc-sub">${stats[t].reduce((s,x)=>s+x.capacite,0)} places total</div>
      </div>
    </div>`).join("")}
  </div>
  <div class="card fade-up-1">
    <div class="table-wrap"><table>
      <thead><tr><th>Salle</th><th>Type</th><th>Capacité</th><th>Bâtiment</th><th>Utilisation</th><th>Actions</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="6" class="empty-state">Aucune salle enregistrée</td></tr>`}</tbody>
    </table></div>
  </div>`;
}
function salleForm(s){
  return`
    <div class="form-row">
      <div class="form-group"><label class="form-label">Nom / Numéro</label><input class="form-input" id="s-nom" value="${s?s.nom:""}"/></div>
      <div class="form-group"><label class="form-label">Type</label>
        <select class="form-select" id="s-type">
          ${["CM","TD","TP"].map(t=>`<option${s&&s.type===t?" selected":""}>${t}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Capacité (places)</label><input class="form-input" id="s-cap" type="number" min="1" value="${s?s.capacite:30}"/></div>
      <div class="form-group"><label class="form-label">Bâtiment</label><input class="form-input" id="s-bat" value="${s?s.batiment||"":""}"/></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-blue" onclick="saveSalle(${s?s.id:"null"})">Enregistrer</button>
    </div>`;
}
function addSalle(){openModal("Nouvelle salle",salleForm(null));}
function editSalle(id){const s=S.data.salles.find(x=>x.id===id);openModal(`Modifier — ${s.nom}`,salleForm(s));}
function saveSalle(id){
  const nom=document.getElementById("s-nom").value.trim();if(!nom)return;
  const obj={nom,type:document.getElementById("s-type").value,capacite:+document.getElementById("s-cap").value,batiment:document.getElementById("s-bat").value};
  if(id&&id!=="null"){Object.assign(S.data.salles.find(x=>x.id===+id),obj);}
  else{obj.id=Math.max(0,...S.data.salles.map(x=>x.id))+1;S.data.salles.push(obj);}
  save();closeModal();toast("Salle enregistrée ✅");setNav("sal");
}
function delSalle(id){
  if(!confirm("Supprimer cette salle ?"))return;
  S.data.salles=S.data.salles.filter(x=>x.id!==id);
  S.data.cours=S.data.cours.map(c=>c.salId===id?{...c,salId:null}:c);
  save();toast("Salle supprimée");setNav("sal");
}

            <div style="opacity:.8">🏛️ ${sal?sal.nom:"—"}</div>

              <button onclick="editEdtCell('${selFil}','${jour}','${cr.id}')" style="background:rgba(255,255,255,.7);border:none;border-radius:4px;padding:1px 5px;font-size:9px;cursor:pointer">✏️</button>
              <button onclick="delEdtCell('${selFil}','${jour}','${cr.id}')" style="background:rgba(255,100,100,.2);border:none;border-radius:4px;padding:1px 5px;font-size:9px;cursor:pointer">✕</button>
            </div>`:""}
          </div>
        </td>`;
      } else {
        return`<td style="padding:3px">
          <div style="min-height:64px;border:1.5px dashed #e2e8f0;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s"

      </div>
      <div style="display:flex;gap:8px">

  const salOpts=`<option value="">— Optionnel —</option>`+d.salles.map(s=>`<option value="${s.id}"${existing&&existing.salId===s.id?" selected":""}>${s.nom} (${s.type}·${s.capacite}p)</option>`).join("");

function addEdtCell(filId,jour,crId){
  filId=+filId;
  openModal("Ajouter un créneau",edtCellForm(filId,jour,crId,null));
}
function editEdtCell(filId,jour,crId){
  filId=+filId;
  const edt=S.data.emploiDuTemps||[];
  const ex=edt.find(e=>e.filId===filId&&e.jour===jour&&e.crId===crId);
  openModal("Modifier le créneau",edtCellForm(filId,jour,crId,ex));
}
function saveEdtCell(filId,jour,crId,isEdit){
  const coursId=+document.getElementById("edt-crs").value;if(!coursId)return;
  const ensId=+document.getElementById("edt-ens").value||null;
  const salId=+document.getElementById("edt-sal").value||null;
  if(!S.data.emploiDuTemps)S.data.emploiDuTemps=[];
  S.data.emploiDuTemps=S.data.emploiDuTemps.filter(e=>!(e.filId===filId&&e.jour===jour&&e.crId===crId));
  S.data.emploiDuTemps.push({filId,jour,crId,coursId,ensId,salId});
  save();closeModal();toast("Créneau enregistré ✅");setNav("edt");
}
function delEdtCell(filId,jour,crId){
  filId=+filId;

  S.data.emploiDuTemps=(S.data.emploiDuTemps||[]).filter(e=>!(e.filId===filId&&e.jour===jour&&e.crId===crId));

}

function openModal(title,body){
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-body").innerHTML=body;
  document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open");}
document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});

function toast(msg,type="success"){
  const el=document.createElement("div");
  el.className=`toast ${type}`;
  el.innerHTML=msg;
  document.getElementById("toast").appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transform="translateX(20px)";el.style.transition=".3s";setTimeout(()=>el.remove(),300)},3000);
}
