    [dir="rtl"] th, [dir="rtl"] td { text-align: right; }

function DashboardView({ t, data }) {
  const { filieres, enseignants, cours } = data;
  const totalVH = cours.reduce((s,c)=>s+c.heures,0);
  const moyVH = Math.round(totalVH/enseignants.length);
  const cmH = cours.filter(c=>c.type==="CM").reduce((s,c)=>s+c.heures,0);
  const tdH = cours.filter(c=>c.type==="TD").reduce((s,c)=>s+c.heures,0);
  const tpH = cours.filter(c=>c.type==="TP").reduce((s,c)=>s+c.heures,0);
  const ensData = enseignants.map(e=>({ name:`${e.prenom[0]}.${e.nom}`, vh: cours.filter(c=>c.ensId===e.id).reduce((s,c)=>s+c.heures,0) }));
  const filData = filieres.map(f=>({ name:f.nom.slice(0,14)+"…", vh:cours.filter(c=>c.filId===f.id).reduce((s,c)=>s+c.heures,0) }));
  const typeData=[{name:t.cm,value:cmH,color:"#3b82f6"},{name:t.td,value:tdH,color:"#10b981"},{name:t.tp,value:tpH,color:"#f59e0b"}];

  return (
    <div>
      <h2 style={{ margin:'0 0 1.25rem', fontSize:20, fontWeight:700, color:'var(--text)' }}>{t.nav.dash}</h2>
      <div className="grid-auto" style={{ marginBottom:16 }}>
        <StatCard label={t.totalVH} value={`${totalVH}h`} icon="⏱️" color="#3b82f6" sub={`${cours.length} ${t.totalCrs}`} />
        <StatCard label={t.totalEns} value={enseignants.length} icon="👨‍🏫" color="#10b981" />
        <StatCard label={t.totalFil} value={filieres.length} icon="🎓" color="#8b5cf6" />
        <StatCard label={t.moyVH} value={`${moyVH}h`} icon="📊" color="#f59e0b" />
        <StatCard label={t.cm} value={`${cmH}h`} icon="📖" color="#3b82f6" />
        <StatCard label={t.td} value={`${tdH}h`} icon="✏️" color="#10b981" />
        <StatCard label={t.tp} value={`${tpH}h`} icon="🔬" color="#ef4444" />
      </div>
      <div className="grid-2">
        <div className="card">
          <h3 style={{ margin:'0 0 .75rem', fontSize:13, fontWeight:600, color:'var(--text2)' }}>{t.vhParEns}</h3>
          <ResponsiveContainer width="100%" height={200}>
            <BarChart data={ensData} layout="vertical">
              <XAxis type="number" tick={{ fontSize:11, fill:'#94a3b8' }} />
              <YAxis dataKey="name" type="category" width={65} tick={{ fontSize:11, fill:'#94a3b8' }} />
              <Tooltip contentStyle={{ background:'#1e293b', border:'1px solid #334155', borderRadius:8, color:'#f1f5f9' }} formatter={v=>`${v}h`} />
              <Bar dataKey="vh" fill="#f59e0b" radius={[0,4,4,0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
        <div className="card">
          <h3 style={{ margin:'0 0 .75rem', fontSize:13, fontWeight:600, color:'var(--text2)' }}>{t.repartTypes}</h3>
          <ResponsiveContainer width="100%" height={200}>
            <PieChart>
              <Pie data={typeData} cx="50%" cy="50%" outerRadius={75} dataKey="value" label={({name,value})=>`${value}h`}>
                {typeData.map((e,i)=><Cell key={i} fill={e.color}/>)}
              </Pie>

// ── Prévisions ────────────────────────────────────────────────────────────────
function PrevisionsView({ t, data }) {
  const [growth,setGrowth]=useState(10);
  const [generated,setGenerated]=useState(false);
  const totalVH=data.cours.reduce((s,c)=>s+c.heures,0);
  const moy=Math.round(totalVH/data.enseignants.length);
  const prevTot=Math.round(totalVH*(1+growth/100));
  const prevMoy=Math.round(moy*(1+growth/100));
  const prevNb=Math.ceil(prevTot/data.enseignants[0].vhTotal);
  const chartData=[{year:"Actuel",vh:totalVH,moy},{year:"N+1",vh:prevTot,moy:prevMoy},{year:"N+2",vh:Math.round(prevTot*(1+growth/100)),moy:Math.round(prevMoy*(1+growth/100))}];

  return (
    <div>
      <h2 style={{ margin:'0 0 1.25rem', fontSize:20, fontWeight:700, color:'var(--text)' }}>{t.prevTitle}</h2>
      <div className="card">
        <p style={{ margin:'0 0 1rem', fontSize:13, color:'var(--text2)' }}>{t.basedOn}</p>
        <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:16, flexWrap:'wrap' }}>
          <label style={{ fontSize:13, fontWeight:600, color:'var(--text)' }}>{t.growth}</label>
          <input type="range" min={0} max={50} step={1} value={growth} onChange={e=>setGrowth(+e.target.value)} style={{ width:200, accentColor:'var(--gold)' }} />
          <span style={{ fontSize:18, fontWeight:700, color:'var(--gold)', minWidth:40 }}>{growth}%</span>
          <button className="btn btn-gold" onClick={()=>setGenerated(true)}>🔮 {t.generate}</button>
        </div>
        {generated && (
          <>
            <div className="grid-auto" style={{ marginBottom:'1.5rem' }}>
              <StatCard label={t.prevTot} value={`${prevTot}h`} icon="📈" color="#3b82f6" sub={`+${growth}%`} />
              <StatCard label={t.prevNb} value={prevNb} icon="👨‍🏫" color="#10b981" sub={`vs ${data.enseignants.length} actuels`} />
              <StatCard label={t.prevMoy} value={`${prevMoy}h`} icon="📊" color="#f59e0b" sub={`vs ${moy}h actuel`} />
            </div>
            <div className="card" style={{ background:'var(--bg3)', border:'1px solid var(--border)' }}>
              <h3 style={{ margin:'0 0 .75rem', fontSize:13, fontWeight:600, color:'var(--text2)' }}>{t.totalVH} — Évolution</h3>
              <ResponsiveContainer width="100%" height={200}>
                <BarChart data={chartData}>
                  <XAxis dataKey="year" tick={{ fontSize:12, fill:'#94a3b8' }} />
                  <YAxis tick={{ fontSize:11, fill:'#94a3b8' }} />
                  <Tooltip contentStyle={{ background:'#1e293b', border:'1px solid #334155', borderRadius:8, color:'#f1f5f9' }} formatter={v=>`${v}h`} />
                  <Bar dataKey="vh" name="VH total" fill="#f59e0b" radius={[4,4,0,0]} />
                  <Bar dataKey="moy" name="Moyenne" fill="#3b82f6" radius={[4,4,0,0]} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [data, setData] = useState(() => {
    try { const s = localStorage.getItem('gh_vh_data'); return s ? JSON.parse(s) : INIT; } catch { return INIT; }
  });
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const t = T[lang];

  // Persist data
  useEffect(() => { try { localStorage.setItem('gh_vh_data', JSON.stringify(data)); } catch {} }, [data]);

  // PWA install prompt
  useEffect(() => {
    const handler = e => { e.preventDefault(); setDeferredPrompt(e); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  // Service worker
  useEffect(() => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  }, []);

  const handleInstall = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    setDeferredPrompt(null);
  };

  if (view === "landing") {
    return (
      <>
        <LandingPage t={t} lang={lang} setLang={setLang} onEnter={() => setView("login")} />
        {deferredPrompt && (
          <div className="install-banner">
            <span>📱 {t.installApp}</span>
            <span style={{ color:'var(--text2)', fontSize:11 }}>{t.installDesc}</span>
            <button className="btn btn-gold btn-sm" onClick={handleInstall}>Installer</button>
            <button className="btn btn-dark btn-sm" onClick={()=>setDeferredPrompt(null)}>✕</button>
          </div>
        )}
      </>
    );
  }

  if (view === "login" && !loggedIn) {
    return <Login t={t} lang={lang} setLang={setLang} onLogin={() => { setLoggedIn(true); setView("app"); }} />;
  }

  return (
    <div className="app-wrap" dir={t.dir}>
      <Sidebar t={t} active={activeNav} setActive={setActiveNav} open={sidebarOpen} />
      <div className="main-area">
        <Topbar t={t} lang={lang} setLang={setLang}
          onLogout={() => { setLoggedIn(false); setView("landing"); }}
          toggleSidebar={() => setSidebarOpen(!sidebarOpen)} />
        <div className="content-area">
          {activeNav==="dash" && <DashboardView t={t} data={data} />}
          {activeNav==="fil"  && <FilieresView t={t} data={data} setData={setData} />}
          {activeNav==="ens"  && <EnseignantsView t={t} data={data} setData={setData} />}
          {activeNav==="crs"  && <CoursView t={t} data={data} setData={setData} />}
          {activeNav==="rep"  && <RepartitionView t={t} data={data} />}
          {activeNav==="stat" && <StatistiquesView t={t} data={data} />}
          {activeNav==="prev" && <PrevisionsView t={t} data={data} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(r => {
      console.log('SW registered:', r.scope);
    }).catch(err => console.log('SW failed:', err));
  });
}
</script>
</body>
</html>
